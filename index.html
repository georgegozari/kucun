<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>藥品庫存</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon-v2.png">
<link rel="icon" type="image/png" href="icon-v2.png">
<meta name="apple-mobile-web-app-title" content="藥品庫存">
<meta name="theme-color" content="#5b3b8c">
<script>
  var APP = "https://script.google.com/macros/s/AKfycbyXVi1RhoZxAH6RrTS6Q_q4W0mHnyYX5fDOOu5B9BYEgFH1ISNnl_C-pGX1qmr0Uy7snQ/exec";
  // 從主畫面圖示打開時網址會帶 ?go → 直接進入 App
  if (/[?&]go(=|&|$)/.test(location.search)) { location.replace(APP); }
  else {
    // 第一次用 Safari 打開：先把網址換成 ?go，這樣「加入主畫面」存下來的就是會自動跳轉的網址
    try { history.replaceState(null, "", location.pathname + "?go"); } catch (e) {}
  }
</script>
<style>
  :root{--accent:#5b3b8c;--fg:#17151c;--muted:#6e6a78;--line:#e9e7ee;--panel:#f5f5f8}
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:var(--fg);font-family:"PingFang TC","Noto Sans TC",-apple-system,sans-serif}
  main{max-width:420px;margin:0 auto;padding:40px max(20px,env(safe-area-inset-left,0px)) 40px;display:grid;gap:20px;text-align:center}
  img.icon{width:120px;height:120px;border-radius:27px;margin:0 auto;box-shadow:0 8px 24px rgba(91,59,140,.25)}
  h1{margin:0;font-size:24px}
  p{margin:0;color:var(--muted);line-height:1.6}
  ol{text-align:left;margin:0;padding:16px 16px 16px 36px;background:var(--panel);border-radius:16px;line-height:1.9}
  .share{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;background:#fff;font-size:13px}
  a.btn{display:block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;border-radius:14px;padding:14px}
</style>
</head>
<body>
<main>
  <img class="icon" src="icon-v2.png" alt="">
  <h1>藥品庫存</h1>
  <p>把這頁加到 iPhone 主畫面，<br>之後點紫色圖示就會直接打開庫存 App。</p>
  <ol>
    <li>用 <b>Safari</b> 打開這一頁</li>
    <li>點下方的分享按鈕 <span class="share">⬆︎</span></li>
    <li>往下滑，選「<b>加入主畫面</b>」</li>
    <li>按右上角「<b>加入</b>」</li>
  </ol>
  <a class="btn" href="https://script.google.com/macros/s/AKfycbyXVi1RhoZxAH6RrTS6Q_q4W0mHnyYX5fDOOu5B9BYEgFH1ISNnl_C-pGX1qmr0Uy7snQ/exec">直接打開 App</a>
</main>
</body>
</html>
